name: Sign APK (v1-only, no v2/v3)

# Manually trigger from the Actions tab after uploading moovidos_unsigned_v7.apk
# to the repo root (or adjust the path below).
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (for apksigner + zipalign)
        uses: android-actions/setup-android@v3

      - name: Generate a debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: zipalign
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -p -f 4 moovidos_unsigned_v7.apk moovidos_aligned.apk

      - name: Sign with apksigner - v1 ONLY (v2/v3 disabled)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled false \
            --v3-signing-enabled false \
            --out moovidos_v1only_signed.apk \
            moovidos_aligned.apk

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose moovidos_v1only_signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: moovidos_v1only_signed
          path: moovidos_v1only_signed.apk
